<p-dialog [header]="isEditMode ? 'Edit Department' : 'New Department'" [(visible)]="visible" [modal]="true"
  [style]="{ width: '450px' }" (onHide)="close()">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="mb-3">
      <label for="name" class="form-label">Name</label>
      <input id="name" type="text" class="w-100" pInputText formControlName="name">
      @if(form.controls.name.invalid && form.controls.name.touched) {
      <small class="text-danger">Name is required.</small>
      }
    </div>

    <div class="mb-3">
      <label for="description" class="form-label">Description</label>
      <textarea id="description" class="w-100" pInputTextarea formControlName="description" rows="3"></textarea>
    </div>

    <div class="d-flex justify-content-end gap-2">
      <p-button label="Cancel" severity="secondary" type="button" (onClick)="close()" />
      <p-button label="Save" type="submit" [loading]="isSaving" />
    </div>
  </form>
</p-dialog>
