<p-dialog [header]="isEditMode ? 'Edit Employee' : 'New Employee'" [(visible)]="visible" [modal]="true"
  [style]="{ width: '500px' }" (onHide)="close()">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="row">
      <div class="col-6 mb-3">
        <label for="firstName" class="form-label">First Name</label>
        <input id="firstName" type="text" pInputText class="w-100" formControlName="firstName" />
      </div>
      <div class="col-6 mb-3">
        <label for="lastName" class="form-label">Last Name</label>
        <input id="lastName" type="text" pInputText class="w-100" formControlName="lastName" />
      </div>
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input id="email" type="email" pInputText class="w-100" formControlName="email" />
      @if (isEditMode) {
      <small class="text-muted">Email can't be changed after creation.</small>
      }
    </div>

    <div class="mb-3">
      <label for="jobTitle" class="form-label">Job Title</label>
      <input id="jobTitle" type="text" pInputText class="w-100" formControlName="jobTitle" />
    </div>

    <div class="row">
      <div class="col-6 mb-3">
        <label for="hireDate" class="form-label">Hire Date</label>
        <p-calendar formControlName="hireDate" [showIcon]="true" dateFormat="yy-mm-dd" styleClass="w-100" appendTo="body" />
      </div>
      <div class="col-6 mb-3">
        <label for="status" class="form-label">Status</label>
        <p-dropdown formControlName="status" [options]="statusOptions" optionLabel="key" optionValue="value"
          styleClass="w-100" appendTo="body">

          <ng-template let-selectedStatus pTemplate="selectedItem">
            {{ statusLabel(selectedStatus) }}
          </ng-template>

          <ng-template let-status pTemplate="item">
            {{ statusLabel(status) }}
          </ng-template>


        </p-dropdown>
      </div>
    </div>

    <div class="mb-3">
      <label for="departmentId" class="form-label">Department</label>
      <p-dropdown formControlName="departmentId" [options]="departments" optionLabel="name" optionValue="id"
        placeholder="Select a department" styleClass="w-100" appendTo="body" />
    </div>

    <div class="d-flex justify-content-end gap-2">
      <p-button label="Cancel" severity="secondary" type="button" (onClick)="close()" />
      <p-button label="Save" type="submit" [loading]="isSaving" />
    </div>
  </form>
</p-dialog>
